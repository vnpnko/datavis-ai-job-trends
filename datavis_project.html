<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Data Visualisation Project</title>
    <link rel="stylesheet" href="datavis_project.css" />
    <script src="https://d3js.org/d3.v6.js"></script>
  </head>
  <body>
    <div class="stacked_bar_tooltip" id="stacked_bar_tooltip"></div>

    <div class="layout">
      <div class="controls-panel">
        <h2>AI Impact on Job Market</h2>

        <div class="controls-section">
          <div id="filter_job_titles"></div>
        </div>
        <div class="controls-divider"></div>
        <div class="controls-section">
          <div>Sort industries</div>
          <div id="sort_industries"></div>
        </div>
        <div class="controls-divider"></div>
        <div class="controls-section">
          <div>Filter by location</div>
          <div id="location_controls"></div>
        </div>
      </div>

      <div class="charts-panel">
        <div id="stacked_bar_container" class="chart-block">
          <div class="chart-title">AI impact</div>
          <div id="stacked_bar_chart"></div>
        </div>
        <div id="heatmap_container" class="chart-block">
          <div id="heatmap"></div>
          <div class="chart-title">Automation risk</div>
        </div>
        <div id="bar_chart_container" class="chart-block">
          <div id="bar_chart"></div>
          <div class="chart-title chart-title--right">Job openings</div>
        </div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
